<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t2 d2">
  <title id="t2">How a JupyterHub session on Isambard-AI starts</title>
  <desc id="d2">Your web browser connects to JupyterHub. JupyterHub asks the Slurm scheduler for GPUs. Slurm starts JupyterLab on a compute node with four GH200s. The compute node can read the shared project folder and write to your own scratch folder.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b895ce"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>
  <g text-anchor="middle">
    <rect x="20" y="40" width="170" height="90" rx="10" fill="#f4eef8" stroke="#3d0251" stroke-width="2"/>
    <text x="105" y="76" font-size="17" font-weight="700" fill="#3d0251">Your browser</text>
    <text x="105" y="102" font-size="13" fill="#333">anywhere</text>

    <rect x="240" y="40" width="190" height="90" rx="10" fill="#f4eef8" stroke="#3d0251" stroke-width="2"/>
    <text x="335" y="76" font-size="17" font-weight="700" fill="#3d0251">JupyterHub</text>
    <text x="335" y="102" font-size="13" fill="#333">apps.isambard.ac.uk</text>

    <rect x="480" y="40" width="170" height="90" rx="10" fill="#f4eef8" stroke="#3d0251" stroke-width="2"/>
    <text x="565" y="76" font-size="17" font-weight="700" fill="#3d0251">Slurm</text>
    <text x="565" y="102" font-size="13" fill="#333">finds free GPUs</text>

    <rect x="700" y="30" width="180" height="110" rx="10" fill="#3d0251"/>
    <text x="790" y="66" font-size="17" font-weight="700" fill="#ffffff">Compute node</text>
    <text x="790" y="92" font-size="13" fill="#ffffff">JupyterLab</text>
    <text x="790" y="114" font-size="13" fill="#ffffff">+ 4 GH200s</text>
  </g>
  <g stroke="#b895ce" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="192" y1="85" x2="236" y2="85"/>
    <line x1="432" y1="85" x2="476" y2="85"/>
    <line x1="652" y1="85" x2="696" y2="85"/>
    <line x1="760" y1="142" x2="660" y2="205"/>
    <line x1="820" y1="142" x2="820" y2="205"/>
  </g>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="214" y="160">1. log in</text>
    <text x="454" y="160">2. ask for GPUs</text>
    <text x="674" y="160">3. start session</text>
  </g>
  <!-- storage -->
  <g text-anchor="middle">
    <g transform="translate(520,210)">
      <ellipse cx="90" cy="10" rx="90" ry="12" fill="#ffffff" stroke="#3d0251" stroke-width="2"/>
      <path d="M0 10 V80 A90 12 0 0 0 180 80 V10" fill="#ffffff" stroke="#3d0251" stroke-width="2"/>
      <text x="90" y="44" font-size="14" font-weight="700" fill="#3d0251">$PROJECTDIR</text>
      <text x="90" y="64" font-size="12" fill="#333">shared course data</text>
      <text x="90" y="80" font-size="12" fill="#333">(read only)</text>
    </g>
    <g transform="translate(730,210)">
      <ellipse cx="80" cy="10" rx="80" ry="12" fill="#f4eef8" stroke="#3d0251" stroke-width="2"/>
      <path d="M0 10 V80 A80 12 0 0 0 160 80 V10" fill="#f4eef8" stroke="#3d0251" stroke-width="2"/>
      <text x="80" y="44" font-size="14" font-weight="700" fill="#3d0251">$SCRATCHDIR</text>
      <text x="80" y="64" font-size="12" fill="#333">your work</text>
      <text x="80" y="80" font-size="12" fill="#333">(not backed up)</text>
    </g>
  </g>
  <text x="20" y="290" font-size="13" fill="#666">The session ends when its time runs out,</text>
  <text x="20" y="308" font-size="13" fill="#666">without warning. Save often.</text>
</svg>
