<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t1 d1">
  <title id="t1">A laptop compared with one Isambard-AI node</title>
  <desc id="d1">A typical laptop has a handful of CPU cores and often no NVIDIA GPU. One Isambard-AI node has four GH200 superchips, each with a 72-core Grace CPU and an H100 GPU with 96 GB of memory. Isambard-AI Phase 2 has 1,320 of these nodes.</desc>
  <rect width="860" height="340" fill="#ffffff"/>

  <!-- laptop -->
  <text x="130" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#3d0251">Your laptop</text>
  <rect x="40" y="60" width="180" height="120" rx="10" fill="#f4eef8" stroke="#3d0251" stroke-width="2"/>
  <rect x="62" y="80" width="136" height="36" rx="6" fill="#ffffff" stroke="#b895ce" stroke-width="2"/>
  <text x="130" y="103" text-anchor="middle" font-size="14" fill="#3d0251">CPU: 4–16 cores</text>
  <rect x="62" y="126" width="136" height="36" rx="6" fill="#ffffff" stroke="#b895ce" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="130" y="149" text-anchor="middle" font-size="14" fill="#666">GPU: often none</text>
  <path d="M25 190 H235 L220 205 H40 Z" fill="#3d0251"/>
  <text x="130" y="240" text-anchor="middle" font-size="14" fill="#333">8–32 GB memory</text>

  <!-- arrow -->
  <text x="282" y="140" text-anchor="middle" font-size="40" fill="#b895ce">→</text>

  <!-- node -->
  <text x="580" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#3d0251">One Isambard-AI node</text>
  <rect x="330" y="50" width="500" height="220" rx="12" fill="#f4eef8" stroke="#3d0251" stroke-width="2"/>
  <g font-size="13" text-anchor="middle">
    <g transform="translate(345,66)">
      <rect width="110" height="188" rx="8" fill="#ffffff" stroke="#3d0251" stroke-width="2"/>
      <text x="55" y="22" font-weight="700" fill="#3d0251">GH200 0</text>
      <rect x="10" y="34" width="90" height="62" rx="6" fill="#ffffff" stroke="#b895ce" stroke-width="2"/>
      <text x="55" y="58" fill="#3d0251">Grace CPU</text><text x="55" y="78" fill="#333">72 cores</text>
      <rect x="10" y="108" width="90" height="68" rx="6" fill="#3d0251"/>
      <text x="55" y="134" fill="#ffffff" font-weight="700">H100 GPU</text><text x="55" y="156" fill="#ffffff">96 GB</text>
    </g>
    <g transform="translate(467,66)">
      <rect width="110" height="188" rx="8" fill="#ffffff" stroke="#3d0251" stroke-width="2"/>
      <text x="55" y="22" font-weight="700" fill="#3d0251">GH200 1</text>
      <rect x="10" y="34" width="90" height="62" rx="6" fill="#ffffff" stroke="#b895ce" stroke-width="2"/>
      <text x="55" y="58" fill="#3d0251">Grace CPU</text><text x="55" y="78" fill="#333">72 cores</text>
      <rect x="10" y="108" width="90" height="68" rx="6" fill="#3d0251"/>
      <text x="55" y="134" fill="#ffffff" font-weight="700">H100 GPU</text><text x="55" y="156" fill="#ffffff">96 GB</text>
    </g>
    <g transform="translate(589,66)">
      <rect width="110" height="188" rx="8" fill="#ffffff" stroke="#3d0251" stroke-width="2"/>
      <text x="55" y="22" font-weight="700" fill="#3d0251">GH200 2</text>
      <rect x="10" y="34" width="90" height="62" rx="6" fill="#ffffff" stroke="#b895ce" stroke-width="2"/>
      <text x="55" y="58" fill="#3d0251">Grace CPU</text><text x="55" y="78" fill="#333">72 cores</text>
      <rect x="10" y="108" width="90" height="68" rx="6" fill="#3d0251"/>
      <text x="55" y="134" fill="#ffffff" font-weight="700">H100 GPU</text><text x="55" y="156" fill="#ffffff">96 GB</text>
    </g>
    <g transform="translate(711,66)">
      <rect width="110" height="188" rx="8" fill="#ffffff" stroke="#3d0251" stroke-width="2"/>
      <text x="55" y="22" font-weight="700" fill="#3d0251">GH200 3</text>
      <rect x="10" y="34" width="90" height="62" rx="6" fill="#ffffff" stroke="#b895ce" stroke-width="2"/>
      <text x="55" y="58" fill="#3d0251">Grace CPU</text><text x="55" y="78" fill="#333">72 cores</text>
      <rect x="10" y="108" width="90" height="68" rx="6" fill="#3d0251"/>
      <text x="55" y="134" fill="#ffffff" font-weight="700">H100 GPU</text><text x="55" y="156" fill="#ffffff">96 GB</text>
    </g>
  </g>
  <text x="580" y="302" text-anchor="middle" font-size="16" fill="#333">× 1,320 nodes in Isambard-AI Phase 2</text>
  <text x="580" y="326" text-anchor="middle" font-size="13" fill="#666">Today you get one node: 4 GPUs, 288 CPU cores</text>
</svg>
