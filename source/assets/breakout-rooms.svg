<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t4 d4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t4">How the breakout rooms work</title>
  <desc id="d4">Everyone starts in the main room, where the instructor teaches and demonstrates. For the hands-on parts, people move into breakout rooms. In each room, one driver runs the notebook on Isambard-AI with one GPU and shares their screen, and the rest of the group reads along, suggests what to try and answers the exercises. Groups post a thumbs up and their answers in the main chat, and the instructors drop into the rooms to help.</desc>
  <defs>
    <marker id="ah4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b895ce"/>
    </marker>
    <g id="person">
      <circle cx="0" cy="-9" r="7" fill="#b895ce"/>
      <path d="M-11,12 a11,11 0 0 1 22,0 z" fill="#b895ce"/>
    </g>
    <g id="driver">
      <circle cx="0" cy="-9" r="7" fill="#3d0251"/>
      <path d="M-11,12 a11,11 0 0 1 22,0 z" fill="#3d0251"/>
    </g>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Main room -->
  <rect x="20" y="40" width="200" height="250" rx="12" fill="#3d0251"/>
  <text x="120" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Main room</text>
  <text x="120" y="112" text-anchor="middle" font-size="14" fill="#ffffff">Instructor teaches</text>
  <text x="120" y="132" text-anchor="middle" font-size="14" fill="#ffffff">and demonstrates</text>
  <line x1="45" y1="152" x2="195" y2="152" stroke="#b895ce" stroke-width="1"/>
  <text x="120" y="178" text-anchor="middle" font-size="13" fill="#e9dcf2">Intro and why HPC</text>
  <text x="120" y="200" text-anchor="middle" font-size="13" fill="#e9dcf2">Start of each section</text>
  <text x="120" y="222" text-anchor="middle" font-size="13" fill="#e9dcf2">Four-GPU demo</text>
  <text x="120" y="244" text-anchor="middle" font-size="13" fill="#e9dcf2">Good practice</text>
  <text x="120" y="266" text-anchor="middle" font-size="13" fill="#e9dcf2">and summary</text>

  <!-- Arrows main -> rooms -->
  <g stroke="#b895ce" stroke-width="3" fill="none" marker-end="url(#ah4)">
    <path d="M222,110 C260,110 260,75 296,75"/>
    <path d="M222,165 L296,165"/>
    <path d="M222,220 C260,220 260,255 296,255"/>
  </g>

  <!-- Rooms -->
  <g>
    <rect x="300" y="40" width="330" height="70" rx="10" fill="#f4eef8" stroke="#3d0251" stroke-width="2"/>
    <text x="316" y="66" font-size="15" font-weight="700" fill="#3d0251">Room 1</text>
    <use href="#driver" x="335" y="94"/>
    <use href="#person" x="400" y="94"/><use href="#person" x="430" y="94"/><use href="#person" x="460" y="94"/><use href="#person" x="490" y="94"/>
    <rect x="530" y="56" width="86" height="40" rx="5" fill="#ffffff" stroke="#3d0251" stroke-width="2"/>
    <text x="573" y="74" text-anchor="middle" font-size="11" fill="#3d0251">driver's</text>
    <text x="573" y="89" text-anchor="middle" font-size="11" fill="#3d0251">shared screen</text>

    <rect x="300" y="130" width="330" height="70" rx="10" fill="#f4eef8" stroke="#3d0251" stroke-width="2"/>
    <text x="316" y="156" font-size="15" font-weight="700" fill="#3d0251">Room 2</text>
    <use href="#driver" x="335" y="184"/>
    <use href="#person" x="400" y="184"/><use href="#person" x="430" y="184"/><use href="#person" x="460" y="184"/><use href="#person" x="490" y="184"/>
    <rect x="530" y="146" width="86" height="40" rx="5" fill="#ffffff" stroke="#3d0251" stroke-width="2"/>
    <text x="573" y="164" text-anchor="middle" font-size="11" fill="#3d0251">driver's</text>
    <text x="573" y="179" text-anchor="middle" font-size="11" fill="#3d0251">shared screen</text>


    <rect x="300" y="220" width="330" height="70" rx="10" fill="#f4eef8" stroke="#3d0251" stroke-width="2"/>
    <text x="316" y="246" font-size="15" font-weight="700" fill="#3d0251">Room …</text>
    <use href="#driver" x="335" y="274"/>
    <use href="#person" x="400" y="274"/><use href="#person" x="430" y="274"/><use href="#person" x="460" y="274"/><use href="#person" x="490" y="274"/>
    <rect x="530" y="236" width="86" height="40" rx="5" fill="#ffffff" stroke="#3d0251" stroke-width="2"/>
    <text x="573" y="254" text-anchor="middle" font-size="11" fill="#3d0251">driver's</text>
    <text x="573" y="269" text-anchor="middle" font-size="11" fill="#3d0251">shared screen</text>
  </g>

  <!-- Arrows rooms -> Isambard -->
  <g stroke="#b895ce" stroke-width="3" fill="none" marker-end="url(#ah4)">
    <path d="M632,75 C670,75 670,130 700,130"/>
    <path d="M632,165 L700,165"/>
    <path d="M632,255 C670,255 670,200 700,200"/>
  </g>

  <!-- Isambard -->
  <rect x="704" y="95" width="176" height="140" rx="12" fill="#3d0251"/>
  <text x="792" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Isambard-AI</text>
  <text x="792" y="160" text-anchor="middle" font-size="13" fill="#ffffff">one JupyterHub</text>
  <text x="792" y="179" text-anchor="middle" font-size="13" fill="#ffffff">session per room</text>
  <text x="792" y="208" text-anchor="middle" font-size="13" fill="#e9dcf2">1 GH200 each</text>

  <!-- Key -->
  <g transform="translate(40,340)">
    <use href="#driver" x="10" y="8"/>
    <text x="30" y="5" font-size="14" font-weight="700" fill="#3d0251">Driver</text>
    <text x="30" y="24" font-size="13" fill="#333">starts the session, runs the cells, shares their screen</text>
    <use href="#person" x="440" y="8"/>
    <text x="460" y="5" font-size="14" font-weight="700" fill="#3d0251">Everyone else</text>
    <text x="460" y="24" font-size="13" fill="#333">follows the notes, suggests what to try, answers the exercises</text>
  </g>
  <text x="450" y="402" text-anchor="middle" font-size="13" fill="#666">Post a thumbs up and your answers in the main chat. The instructors will drop into the rooms to help.</text>
</svg>
